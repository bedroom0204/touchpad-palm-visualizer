<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A12" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="palmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowLime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Trackpad Body -->
  <rect x="56" y="80" width="400" height="352" rx="36" fill="url(#padGrad)" stroke="#334155" stroke-width="3" />
  
  <!-- Grid Matrix Lines inside Trackpad -->
  <line x1="56" y1="200" x2="456" y2="200" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4,6" />
  <line x1="56" y1="310" x2="456" y2="310" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4,6" />
  <line x1="190" y1="80" x2="190" y2="432" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4,6" />
  <line x1="320" y1="80" x2="320" y2="432" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4,6" />

  <!-- Top Indicator Bar -->
  <rect x="216" y="96" width="80" height="4" rx="2" fill="#00F0FF" filter="url(#glowCyan)" opacity="0.8" />

  <!-- Finger Contact Point 1 (Index Finger) -->
  <circle cx="170" cy="190" r="28" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.4" />
  <circle cx="170" cy="190" r="18" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#glowCyan)" />
  <circle cx="170" cy="190" r="8" fill="#00F0FF" />
  <!-- Trajectory Trail -->
  <path d="M 120 240 Q 140 210 170 190" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#glowCyan)" />

  <!-- Finger Contact Point 2 (Middle Finger) -->
  <circle cx="270" cy="175" r="28" fill="none" stroke="#B4FF39" stroke-width="2" opacity="0.4" />
  <circle cx="270" cy="175" r="18" fill="none" stroke="#B4FF39" stroke-width="3" filter="url(#glowLime)" />
  <circle cx="270" cy="175" r="8" fill="#B4FF39" />
  <!-- Trajectory Trail -->
  <path d="M 220 225 Q 240 195 270 175" fill="none" stroke="#B4FF39" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#glowLime)" />

  <!-- Palm Contact Ellipse (Large Heat Contact Area with Rejection Warning) -->
  <g transform="translate(350, 320) rotate(-25)">
    <!-- Palm Outer Shield Boundary -->
    <ellipse cx="0" cy="0" rx="68" ry="42" fill="rgba(255, 46, 99, 0.15)" stroke="#FF2E63" stroke-width="2.5" stroke-dasharray="6,4" />
    <ellipse cx="0" cy="0" rx="48" ry="28" fill="rgba(255, 46, 99, 0.3)" stroke="#FF2E63" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#FF2E63" />
    <!-- Crosshair indicator -->
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#FF2E63" stroke-width="2" />
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#FF2E63" stroke-width="2" />
  </g>

  <!-- Palm Rejection Badge -->
  <rect x="286" y="380" width="128" height="26" rx="13" fill="#FF2E63" opacity="0.9" />
  <text x="350" y="397" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">PALM SHIELD</text>

  <!-- Multi-touch gesture icon badge in corner -->
  <rect x="76" y="366" width="112" height="26" rx="13" fill="#1E293B" stroke="#00F0FF" stroke-width="1.5" />
  <text x="132" y="383" fill="#00F0FF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2-FINGER PINCH</text>
</svg>
